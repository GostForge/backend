# ──────────────────────────────────────────────────
# GostForge — application.yml (default profile)
# ──────────────────────────────────────────────────

server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: gostforge-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:gostforge}
    username: ${POSTGRES_USER:gostforge}
    password: ${POSTGRES_PASSWORD:gostforge_secret}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# ── JWT ───────────────────────────────────────────
jwt:
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  access-token-ttl: 2592000     # 30 days
  

# ── Internal API ──────────────────────────────────
internal:
  api-key: ${INTERNAL_API_KEY:}

# ── Telegram ──────────────────────────────────────
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}

# ── MinIO ─────────────────────────────────────────

# ── External services ─────────────────────────────
services:
  md2gost:
    url: ${MD2GOST_SERVICE_URL:http://localhost:8081}
    poll-interval-ms: 1500
    max-poll-attempts: 120
  gotenberg:
    url: ${GOTENBERG_SERVICE_URL:http://localhost:3000}

# ── Conversion limits ────────────────────────────
conversion:
  max-concurrent-per-user: 1
  lock-ttl-seconds: 600
  project-size-limit-bytes: 52428800   # 50 MB

# ── Rate limiting ─────────────────────────────────
rate-limit:
  conversion:
    capacity: 5
    refill: 5
    duration-minutes: 10
  registration:
    capacity: 10
    refill: 10
    duration-minutes: 60
  login:
    capacity: 20
    refill: 20
    duration-minutes: 10
  api:
    capacity: 300
    refill: 300
    duration-minutes: 1

# ── CORS ──────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3001,http://localhost:5173}

# ── Actuator ──────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# ── Logging ───────────────────────────────────────
logging:
  level:
    org.gostforge: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
